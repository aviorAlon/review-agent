[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "review-agent"
version = "0.1.0"
description = "A measured AI code reviewer: generalist finder, fail-open verifier, pluggable backends, and the benchmark that keeps it honest"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["code-review", "llm", "ci", "gitlab", "github", "benchmark", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "unidiff>=0.7",
    "litellm>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Structural context for JavaScript/TypeScript, Go and Java. Without this
# extra those files get diff-only context; Python needs nothing.
languages = [
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
]

[project.urls]
Homepage = "https://github.com/aviorAlon/review-agent"
Issues = "https://github.com/aviorAlon/review-agent/issues"
Changelog = "https://github.com/aviorAlon/review-agent/blob/main/CHANGELOG.md"

[project.scripts]
review-agent = "review_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/review_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/review_agent", "tests", "README.md", "LICENSE", "NOTICE", "ROADMAP.md", ".review-agent.example.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
