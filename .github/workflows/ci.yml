name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # No LLM, no network: the suite runs on fake and heuristic backends only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: zero-key smoke
        run: |
          review-agent demo --repo . --diff-file tests/fixtures/sample.diff
          review-agent bench --arms A,B

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t review-agent:ci .
      - run: docker run --rm review-agent:ci --help
